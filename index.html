<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dictado de actividades ATS - SIGT</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:700px;margin:24px auto;padding:20px;color:#222}
    h2{color:#b00020} textarea{box-sizing:border-box;width:100%;min-height:180px;padding:12px;font-size:16px}
    button{padding:12px 16px;margin:8px 6px 8px 0;cursor:pointer;border-radius:7px;border:1px solid #bbb;background:#f6f6f6}
    button:disabled{opacity:.55;cursor:not-allowed} #enviar{background:#b00020;color:white;border-color:#b00020}
    #estado{margin:12px 0;line-height:1.45}
  </style>
</head>
<body>
  <h2>Dictado de actividades ATS</h2>
  <p>Dicta la descripción paso a paso. Al terminar, pulsa <b>Detener</b> y luego <b>Enviar a SIGT</b>.</p>
  <textarea id="texto" placeholder="Aquí aparecerá el texto dictado..."></textarea><br>
  <button id="iniciar">🎙️ Iniciar dictado</button>
  <button id="detener" disabled>Detener</button>
  <button id="enviar">Enviar a SIGT</button>
  <p id="estado" role="status">Listo para probar.</p>
<script>
(function(){
  const texto=document.getElementById('texto'), estado=document.getElementById('estado');
  const iniciar=document.getElementById('iniciar'), detener=document.getElementById('detener'), enviar=document.getElementById('enviar');
  const Constructor=window.SpeechRecognition||window.webkitSpeechRecognition;
  let reconocimiento=null, resultados=[], activo=false, enviado=false;
  if(!window.opener){estado.textContent='Abra esta página desde el botón Dictar por voz del formulario ATS de SIGT para poder devolver el texto.';}
  if(!Constructor){estado.textContent='Este navegador no admite reconocimiento de voz. Pruebe Chrome actualizado.';iniciar.disabled=true;}
  else {
    reconocimiento=new Constructor(); reconocimiento.lang='es-NI'; reconocimiento.continuous=true; reconocimiento.interimResults=true;
    iniciar.addEventListener('click',function(){
      try { resultados=[]; texto.value=''; enviado=false; enviar.disabled=false; reconocimiento.start(); iniciar.disabled=true; detener.disabled=false; estado.textContent='Escuchando... hable ahora.'; }
      catch(e){estado.textContent='No se pudo iniciar. Pulse Detener si sigue activo y vuelva a intentarlo.';}
    });
    detener.addEventListener('click',function(){try{reconocimiento.stop();}catch(e){}});
    reconocimiento.onstart=function(){activo=true;estado.textContent='Escuchando... hable ahora.';};
    reconocimiento.onresult=function(e){
      // Reconstruir el texto desde el conjunto completo de resultados.
      // En algunos móviles el motor entrega la misma frase como resultado final
      // y vuelve a entregarla en el siguiente evento. Se elimina cualquier
      // segmento consecutivo idéntico, sea final o provisional, conservando
      // la versión final cuando ambas coinciden.
      const nuevos=[];
      const normalizar=function(s){return String(s||'').toLocaleLowerCase('es').replace(/[.,;:!?¿¡]+/g,'').replace(/\s+/g,' ').trim();};
      for(let i=0;i<e.results.length;i++){
        const frase=(e.results[i][0].transcript||'').replace(/\s+/g,' ').trim();
        if(!frase) continue;
        const final=!!e.results[i].isFinal;
        const anterior=nuevos.length ? nuevos[nuevos.length-1] : null;
        if(anterior && normalizar(frase)===normalizar(anterior.texto)){
          if(final && !anterior.final) nuevos[nuevos.length-1]={texto:frase,final:true};
          continue;
        }
        nuevos.push({texto:frase,final:final});
      }
      resultados=nuevos;
      texto.value=resultados.map(r=>r.texto).join(' ').replace(/\s+/g,' ').trim();
    };
    reconocimiento.onerror=function(e){estado.textContent='Error de reconocimiento: '+e.error+'. Revise el permiso del micrófono e inténtelo de nuevo.';};
    reconocimiento.onend=function(){activo=false;iniciar.disabled=false;detener.disabled=true;if(!estado.textContent.startsWith('Error'))estado.textContent='Dictado detenido. Revise el texto y pulse Enviar a SIGT.';};
  }
  enviar.addEventListener('click',function(){
    if(enviado) return;
    const transcripcion=texto.value.trim();
    if(!transcripcion){estado.textContent='No hay texto para enviar. Primero dicte o escriba una descripción.';return;}
    if(!window.opener){estado.textContent='No se detectó la ventana de SIGT. Cierre esta página y abra el dictado desde el formulario ATS.';return;}
    enviado=true;
    enviar.disabled=true;
    const messageId='ats-'+Date.now()+'-'+Math.random().toString(36).slice(2);
    // El despliegue de Apps Script puede usar script.google.com o script.googleusercontent.com.
    // El receptor SIGT valida event.origin contra el dominio exacto de GitHub Pages.
    const manejadorConfirmacion=function(evento){
      if(evento.source!==window.opener || !evento.data || evento.data.type!=='SIGT_ATS_DICTATION_ACK' || evento.data.messageId!==messageId) return;
      window.removeEventListener('message',manejadorConfirmacion);
      estado.textContent='SIGT confirmó la recepción. Cerrando esta ventana...';
      window.setTimeout(function(){
        try { window.close(); } catch(e) {}
        if(!window.closed) estado.textContent='SIGT recibió el texto. Puede volver a SIGT y cerrar esta ventana.';
      },150);
    };
    window.addEventListener('message',manejadorConfirmacion);
    window.opener.postMessage({type:'SIGT_ATS_DICTATION_RESULT',text:transcripcion,messageId:messageId},'*');
    estado.textContent='Enviando texto a SIGT y esperando confirmación...';
    window.setTimeout(function(){
      if(!enviado) return;
      window.removeEventListener('message',manejadorConfirmacion);
      if(estado.textContent.indexOf('confirmó la recepción')===-1){
        enviado=false; enviar.disabled=false;
        estado.textContent='SIGT no confirmó la recepción. Vuelva a SIGT, revise que esté desplegado el receptor actualizado e inténtelo de nuevo.';
      }
    },4000);
  });
})();
</script>
</body>
</html>
